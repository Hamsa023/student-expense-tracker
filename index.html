<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hamsa - Expense Tracker</title>
<style>
body{background:#0f172a;color:#fff;font-family:sans-serif;text-align:center;padding:20px}
.card{background:#1e293b;padding:20px;border-radius:16px;max-width:380px;margin:auto}
input,select,button{width:100%;padding:12px;margin:8px 0;border-radius:10px;border:none;font-size:16px}
button{background:#38bdf8;font-weight:bold}
li{background:#334155;padding:10px;margin:6px 0;border-radius:8px;list-style:none;display:flex;justify-content:space-between}
ul{padding:0}
</style>
</head>
<body>
<h2 style="color:#38bdf8">💰 Expense Tracker</h2>
<div class="card">
<input id="n" placeholder="Item - ex: Book">
<input id="a" type="number" placeholder="Amount ₹">
<select id="c"><option>Food</option><option>Education</option><option>Travel</option><option>Other</option></select>
<button onclick="add()">Add</button>
<h3 style="color:#22c55e">Total: ₹<span id="t">0</span></h3>
<ul id="l"></ul>
<button onclick="localStorage.clear();location.reload()" style="background:#ef4444;color:#fff">Clear All</button>
<p style="margin-top:20px;font-size:12px;color:#94a3b8">📍 Made by Hamsa - ATME, Mysuru 👩‍💻</p>
</div>
<script>
let ex=JSON.parse(localStorage.getItem('ex')||'[]');
function show(){
 let s=0; let h='';
 ex.forEach((e,i)=>{s+=e.a; h+=`<li>${e.n} (${e.c})<span>₹${e.a} <b onclick="ex.splice(${i},1);save()" style="color:red">X</b></span></li>`});
 document.getElementById('l').innerHTML=h;
 document.getElementById('t').innerText=s;
}
function save(){localStorage.setItem('ex',JSON.stringify(ex));show()}
function add(){
 let n=document.getElementById('n').value;
 let a=Number(document.getElementById('a').value);
 let c=document.getElementById('c').value;
 if(!n||!a)return alert('Enter details');
 ex.push({n,a,c}); save();
 document.getElementById('n').value=''; document.getElementById('a').value='';
}
show();
</script>
</body>
</html>
