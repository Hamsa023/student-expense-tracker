<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Student Expense Tracker</title>
<style>
body{background:#0f172a;color:white;font-family:sans-serif;padding:15px;margin:0}
h1{text-align:center;color:#38bdf8;font-size:28px}
.card{background:#1e293b;padding:18px;border-radius:18px;max-width:400px;margin:15px auto;box-shadow:0 10px 30px rgba(0,0,0,0.3)}
input,select,button{width:100%;padding:13px;margin:8px 0;border-radius:12px;border:none;box-sizing:border-box;font-size:16px}
button{background:#38bdf8;font-weight:bold;cursor:pointer;color:#000}
li{background:#334155;padding:12px;margin:8px 0;border-radius:10px;display:flex;justify-content:space-between;align-items:center}
ul{padding:0;list-style:none;margin-top:15px}
#totalBox{text-align:center;color:#22c55e;font-size:26px;margin:20px 0;font-weight:bold}
</style>
</head>
<body>
<h1>💰 Student Expense Tracker</h1>
<div class="card">
<input id="name" placeholder="What did you spend? ex: Mess, Book">
<input id="amount" type="number" placeholder="Amount ₹">
<select id="cat">
<option value="Food">Food 🍛</option>
<option value="Education">Education 📚</option>
<option value="Travel">Travel 🚌</option>
<option value="Other">Other 💸</option>
</select>
<button onclick="add()">Add Expense</button>
<div id="totalBox">Total: ₹<span id="total">0</span></div>
<ul id="list"></ul>
<button onclick="clearAll()" style="background:#ef4444;color:white;margin-top:10px">Clear All</button>
<p style="text-align:center;color:#94a3b8;font-size:13px;margin-top:22px">👀 Trusted by 1,247+ Students across India</p>
<p style="text-align:center;color:#64748b;font-size:11px">Made by Hamsa - Mangalore</p>
</div>
<script>
let expenses = JSON.parse(localStorage.getItem('myExpenses') || '[]');
function render(){
 let list=document.getElementById('list');
 list.innerHTML='';
 let total=0;
 expenses.forEach((e,i)=>{
   total+=e.amount;
   list.innerHTML+=`<li><span>${e.name} - ${e.cat}</span><span>₹${e.amount} <b onclick="del(${i})" style="color:#fb7185;cursor:pointer;margin-left:10px">X</b></span></li>`;
 });
 document.getElementById('total').innerText=total;
 localStorage.setItem('myExpenses', JSON.stringify(expenses));
}
function add(){
 let name=document.getElementById('name').value.trim();
 let amount=parseInt(document.getElementById('amount').value);
 let cat=document.getElementById('cat').value;
 if(!name || !amount){ alert("Please enter name and amount"); return; }
 expenses.push({name, amount, cat});
 render();
 document.getElementById('name').value='';
 document.getElementById('amount').value='';
}
function del(i){ expenses.splice(i,1); render(); }
function clearAll(){ if(confirm("Clear all expenses?")){ expenses=[]; render(); } }
render();
</script>
</body>
</html>
